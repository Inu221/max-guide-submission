name: max-guide-submission

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_guide}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-max_guide}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../max-guide-backend
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      SWAGGER_ENABLED: 'true'
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-at-least-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-a-different-random-secret-at-least-32-characters}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      JWT_REFRESH_COOKIE_SAME_SITE: lax
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-max_guide}
      DB_SYNCHRONIZE: 'true'
      DB_LOGGING: 'false'
      MAX_BOT_API_BASE_URL: https://botapi.max.ru
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_NAME: ${MAX_BOT_NAME:-}
      MAX_BOT_WEBHOOK_URL: ${MAX_BOT_WEBHOOK_URL:-}
      MAX_BOT_WEBHOOK_SECRET: ${MAX_BOT_WEBHOOK_SECRET:-}
      MAX_BOT_AUTO_SETUP: 'false'
    ports:
      - '3000:3000'
    volumes:
      - media_data:/usr/src/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  seed:
    build:
      context: ../max-guide-backend
      target: production
    depends_on:
      api:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-max_guide}
    command: ['node', 'dist/scripts/seed-stavropol/seed.js']
    volumes:
      - media_data:/usr/src/app/uploads
    restart: 'no'

  web:
    build:
      context: ../max-guide-frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_YANDEX_MAPS_KEY: ${REACT_APP_YANDEX_MAPS_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - '3001:80'

  admin:
    build:
      context: ../max-guide-admin
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3002:80'

volumes:
  postgres_data:
  media_data:
